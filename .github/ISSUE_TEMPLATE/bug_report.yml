name: Bug report
description: Report a reproducible application problem
body:
  - type: markdown
    attributes:
      value: "Do not post API keys, private recordings or class notes. Use synthetic examples."
  - type: input
    id: version
    attributes:
      label: App version / macOS version / Mac chip
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and input type (microphone / system audio)
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized error text (no credentials or private content)
