name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      LECTURE_CAPTION_DATA_DIR: /tmp/lecture-caption-release
      GROQ_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate version matches tag
        run: python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/collect_licenses.py
      - run: python scripts/build_app.py
      - run: '"dist/Lecture Caption.app/Contents/MacOS/Lecture Caption" --preview'
      - run: python scripts/package_release.py
      - name: Determine release signing policy
        id: signing
        run: |
          python - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import tomllib
          data = tomllib.load(open('pyproject.toml', 'rb'))
          required = data.get('tool', {}).get('lecture-caption', {}).get('release-signing') == 'developer-id'
          print('developer_id=' + str(required).lower())
          PYCODE
      - name: Signed release handoff
        if: steps.signing.outputs.developer_id == 'true'
        run: echo "This runner validates source/build only. Release assets must be Developer ID signed, notarized and verified on the maintainer Mac; do not publish this CI ad-hoc bundle." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish versioned release assets
        if: steps.signing.outputs.developer_id != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --verify-tag --title "Lecture Caption $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
