name: Backend CI
on:
  push:
    branches: [main, feat/version-usage-backend]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r backend/receiver/requirements-lock.txt ruff==0.14.3
      - run: ruff check backend
      - run: ruff format --check backend
      - run: python -m unittest discover -s backend/receiver -p 'test_*.py' -v
      - run: python -m unittest discover -s backend/dashboard -p 'test_*.py' -v
      - run: sh -n backend/receiver/deploy.sh
