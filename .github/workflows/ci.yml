name: CI
on:
  push:
    branches: [main, test/public-usage-acceptance]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      LECTURE_CAPTION_DATA_DIR: /tmp/lecture-caption-ci
      GROQ_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check caption.py core.py credentials.py local_services.py utterances.py updater.py app_install.py math_render.py software_rules.py usage_sync.py tutorial.py onboarding.py notes_editor.py scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py
      - run: python scripts/collect_licenses.py
      - run: python scripts/build_app.py
      - name: Smoke-test bundled app (no capture or API calls)
        run: '"dist/Lecture Caption.app/Contents/MacOS/Lecture Caption" --preview'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-smoke-previews
          path: /tmp/lecture-caption-ci/logs/*preview.png
          if-no-files-found: ignore
          retention-days: 7
