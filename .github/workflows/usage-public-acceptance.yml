name: Public usage acceptance
on:
  push:
    branches: [test/public-usage-acceptance]
    paths:
      - scripts/check_public_usage.py
      - .github/workflows/usage-public-acceptance.yml
permissions:
  contents: read
jobs:
  external-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Public DNS and verified HTTPS from outside the tailnet
        run: python3 scripts/check_public_usage.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-usage-evidence
          path: public-usage-evidence.json
          if-no-files-found: ignore
          retention-days: 14
