[project]
name = "lecture-caption"
version = "3.1.0"
description = "macOS bilingual lecture captions and live Markdown notes with Apple local or cloud processing"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["F"]
ignore = ["F401"]

[tool.lecture-caption]
release-signing = "developer-id"
